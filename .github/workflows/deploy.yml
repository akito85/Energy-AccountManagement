name: Deploy to AKS with Kubeconfig
on:
  push:
    branches:
      - main
      - master
      - account-management-temp

jobs:
  deploy:
    runs-on:
      group: Development
      labels:
        - self-hosted
        - Linux
        - Development
        - X64
    environment: development
    env:
      IMAGE_NAME: registry.pgn.co.id/billing-dev/dbs-module-account
      IMAGE_TAG: latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # - name: Authenticate to Docker Registry
    #   uses: docker/login-action@v3
    #   with:
    #     username: ${{ secrets.REGISTRY_USERNAME }}
    #     password: ${{ secrets.REGISTRY_PASSWORD }}
    #     registry: ${{ env.REGISTRY_URL }}

    # - name: Build and Push Docker Container
    #   run: |
    #     docker build -t $IMAGE_NAME:$IMAGE_TAG .
    #     docker push $IMAGE_NAME:$IMAGE_TAG

    - name: Set up kubeconfig to access cluster
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config
        chmod 600 ~/.kube/config
        kubectl config view

    - name: Test Kubernetes connectivity
      run: |
        kubectl get pods -n energy-development

    - name: Deploy Kubernetes manifests
      run: |
        kubectl apply -f deployment.yaml