spring.datasource.driver-class-name: oracle.jdbc.OracleDriver
spring.datasource.hikari.maxLifetime: 1800000
spring.datasource.hikari.connectionTimeout: 30000
spring.datasource.hikari.idleTimeout: 600000
spring.datasource.hikari.maximumPoolSize: 30
spring.hibernate.ddl-auto: none
spring.hibernate.dialect: org.hibernate.dialect.Oracle12cDialect
spring.hibernate.show_sql: false
spring.hibernate.implicit_naming_strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
spring.hibernate.physical_naming_strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
log4j.logger.org.hibernate.SQL: DEBUG
log4j.logger.org.hibernate.type: TRACE

