apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbs-module-account
  namespace: energy-development
  labels:
    helm.sh/chart: dbs-module-account-0.1.0
    app.kubernetes.io/name: dbs-module-account
    app.kubernetes.io/instance: dbs-module-account
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dbs-module-account
      app.kubernetes.io/instance: dbs-module-account
  template:
    metadata:
      annotations:
        meta.helm.sh/release-name: dbs-module-account
        meta.helm.sh/release-namespace: energy-development
        vault.hashicorp.com/auth-path: "auth/energy-development-kubernetes"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-status: "update"
        vault.hashicorp.com/agent-inject-secret-db-access.properties: "energy-development/data/db_access"
        vault.hashicorp.com/agent-inject-template-db-access.properties: |
          {{- with secret "energy-development/db_access" -}}
          spring.crm-datasource.userName={{ .Data.data.username }}
          spring.crm-datasource.password={{ .Data.data.password }}
          {{- end }}
        vault.hashicorp.com/role: "energy"
      labels:
        helm.sh/chart: dbs-module-account-0.1.0
        app.kubernetes.io/name: dbs-module-account
        app.kubernetes.io/instance: dbs-module-account
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: dbs-module-account
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: dbs-module-account
        app.kubernetes.io/version: 1.0.0
        helm.sh/chart: dbs-module-account
    spec:
      imagePullSecrets:
        - name: pgnregcred
      serviceAccountName: energy-vault
      securityContext:
        {}
      containers:
        - name: dbs-module-account
          securityContext:
            {}
          image: "registry.pgn.co.id/billing-dev/dbs-module-account:latest"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8902
              protocol: TCP
          env:
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/vault/secrets/db-access.properties"
          livenessProbe:
            tcpSocket:
              port: 8902
            initialDelaySeconds: 300
            periodSeconds: 15
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 8902
            initialDelaySeconds: 300
            periodSeconds: 15
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 5
          resources:
            limits:
              cpu: 0.25
              memory: 1Gi
            requests:
              cpu: 0.25
              memory: 512Mi